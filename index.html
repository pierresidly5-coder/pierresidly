<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sidly | Digital, Marketing & Technology</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0a0a0a;
      color: #ffffff;
      line-height: 1.6;
    }

    :root {
      --black: #0a0a0a;
      --dark: #111111;
      --gold: #d4af37;
      --white: #ffffff;
      --gray: #b8b8b8;
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(10, 10, 10, 0.95);
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
    }

    nav {
      max-width: 1200px;
      margin: auto;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: var(--gold);
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 25px;
      font-size: 14px;
    }

    nav a:hover {
      color: var(--gold);
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 120px 25px 70px;
      background:
        radial-gradient(circle at center, #211c0b 0%, #0a0a0a 55%);
    }

    .hero-content {
      max-width: 850px;
    }

    .hero-label {
      color: var(--gold);
      letter-spacing: 4px;
      text-transform: uppercase;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: 64px;
      line-height: 1.1;
      margin-bottom: 20px;
    }

    .hero h1 span {
      color: var(--gold);
    }

    .hero h2 {
      font-size: 22px;
      font-weight: normal;
      color: var(--gray);
      margin-bottom: 25px;
    }

    .hero p {
      color: #cccccc;
      max-width: 650px;
      margin: auto;
      font-size: 17px;
    }

    .buttons {
      margin-top: 35px;
    }

    .btn {
      display: inline-block;
      padding: 13px 25px;
      margin: 6px;
      border-radius: 3px;
      text-decoration: none;
      font-weight: bold;
    }

    .btn-gold {
      background: var(--gold);
      color: #000;
    }

    .btn-outline {
      border: 1px solid var(--gold);
      color: var(--gold);
    }

    section {
      padding: 100px 8%;
    }

    .section-title {
      text-align: center;
      margin-bottom: 50px;
    }

    .section-title small {
      color: var(--gold);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .section-title h2 {
      font-size: 40px;
      margin-top: 10px;
    }

    .section-title p {
      color: var(--gray);
      margin-top: 10px;
    }

    .about {
      max-width: 850px;
      margin: auto;
      text-align: center;
      color: #cccccc;
      font-size: 18px;
    }

    .cards {
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .card {
      background: #111111;
      border: 1px solid #292929;
      padding: 30px;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: var(--gold);
    }

    .card-number {
      color: var(--gold);
      font-size: 13px;
      margin-bottom: 20px;
    }

    .card h3 {
      margin-bottom: 12px;
    }

    .card p {
      color: var(--gray);
      font-size: 14px;
    }

    .contact {
      text-align: center;
      background: #111111;
    }

    footer {
      text-align: center;
      padding: 30px;
      background: #050505;
      color: #777777;
      font-size: 13px;
    }

    @media (max-width: 800px) {
      .hero h1 {
        font-size: 42px;
      }

      .cards {
        grid-template-columns: 1fr 1fr;
      }

      nav {
        padding: 18px;
      }

      nav a {
        margin-left: 8px;
        font-size: 12px;
      }
    }

    @media (max-width: 500px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        font-size: 36px;
      }

      .hero h2 {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
